name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: xcode-27
    timeout-minutes: 30

    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # The keychain only exists for this job, so its password never needs
          # to be stored anywhere. Generate a fresh one on the runner.
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          echo "Importing Apple Development certificate"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain%"${keychain##*[![:space:]]}"}"
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -n "$keychain" ]] && EXISTING_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          rm -f "$CERT_PATH"

      - name: Build
        run: |
          set -euo pipefail

          SIGNING_ARGUMENTS=()
          if [[ "${HAS_SIGNING_CERTIFICATE}" != "true" ]]; then
            echo "No signing certificate configured; building unsigned."
            SIGNING_ARGUMENTS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi

          xcodebuild \
            -project FileCompare.xcodeproj \
            -scheme FileCompare \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            "${SIGNING_ARGUMENTS[@]}" \
            build

      - name: Package
        id: package
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/FileCompare.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")

          if [[ "${HAS_SIGNING_CERTIFICATE}" == "true" ]]; then
            echo "Verifying signature"
            codesign --verify --strict "$APP"
          else
            echo "Build is unsigned; skipping signature verification."
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="FileCompare-${GITHUB_REF_NAME#v}"
          else
            NAME="FileCompare-${VERSION}-${GITHUB_SHA::7}"
          fi

          mkdir -p dist staging

          echo "Creating ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${NAME}.zip"

          echo "Creating DMG"
          cp -R "$APP" staging/
          ln -s /Applications staging/Applications
          diskutil image create from --format UDZO --volumeName FileCompare staging "dist/${NAME}.dmg"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

          {
            echo "### 构建产物"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | ${VERSION} (${BUILD_NUMBER}) |"
            echo "| 架构 | $(lipo -archs "$APP/Contents/MacOS/FileCompare") |"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            ls -lh dist | awk 'NR > 1 { print "| " $9 " | " $5 " |" }'
          } >> "$GITHUB_STEP_SUMMARY"

          ls -lh dist

      - name: Check tag against project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [[ "${TAG#v}" != "$VERSION" ]]; then
            echo "::warning::标签 $TAG 与 MARKETING_VERSION $VERSION 不一致，发布包名称以标签为准。"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          {
            cat .github/release-notes.md
            echo
            echo "## 本次提交"
            echo
            previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty=format:'- %s' "${previous_tag}..HEAD"
            else
              git log --no-merges --pretty=format:'- %s' HEAD
            fi
            echo
          } > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "FileCompare ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Remove signing certificate
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
